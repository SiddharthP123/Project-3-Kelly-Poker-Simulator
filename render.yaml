# Render Blueprint -- defines the backend web service. "New > Blueprint"
# in the Render dashboard can stand this up in one pass.
#
# Postgres is hosted on Supabase, not Render's own database (Render's
# free Postgres tier deletes the whole database after 30 days; Supabase's
# free tier only pauses on inactivity and resumes with a manual click in
# its dashboard -- no data loss, no recreating tables from scratch every
# month). DATABASE_URL is therefore `sync: false` (manually entered in
# the Render dashboard from Supabase's own connection string), not
# `fromDatabase` -- that Blueprint field only works for a database Render
# itself provisions.
#
# See README.md "Part 11: Deployment" for the full step-by-step runbook,
# including what happens with each `sync: false` prompt below.

services:
  - name: kelly-poker-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon # change to whichever region is closest to you
    healthCheckPath: /health
    envVars:
      # Set this to your Supabase project's connection string (Project
      # Settings -> Database -> Connection string -> URI). See README's
      # Part 11 runbook for the full setup steps.
      - key: DATABASE_URL
        sync: false
      # Render prompts for this during Blueprint creation -- generate
      # your own with: python3 -c "import secrets; print(secrets.token_hex(32))"
      # Never reuse backend/config.py's dev-only default here.
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: '60'
      # Placeholder -- update to the real Vercel URL once the frontend
      # is deployed (see the runbook's "chicken-and-egg" step). Render
      # redeploys automatically when an env var changes.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
