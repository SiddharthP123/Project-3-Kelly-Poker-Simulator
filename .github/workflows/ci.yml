name: CI

# Mirrors .pre-commit-config.yaml's three checks exactly, so local and CI
# enforcement never drift apart -- if a check passes locally before a
# commit, it should pass here too, and vice versa.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      # No Postgres service needed -- tests/backend/conftest.py runs the
      # whole suite against a temp-file SQLite database.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
